<!-- Write a JavaScript program to print incremental value every time when button is clicked  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
</head>
<body>
    <button onclick="countNum()"> Click to increment the value in console</button>
    <script>
        var count=0;
        function countNum(){
            count+=1
            console.log(count)
        }
    </script>
</body>
</html>
