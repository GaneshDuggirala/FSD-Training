<h1 class="text-light bg-dark p-3 w-100">GoXploreX</h1>
<div class="container-fluid">
    <div class="row d-flex align-items-center justify-content-between p-5">
        <div class="col-md-7">
            <img src="loginimg.png" alt="" width="400px" class="img-fluid">
        </div>
        <div class="col-md-5">
            <br>
            <h2>Login</h2><br>
            <form action="" [formGroup]="loginform" (ngSubmit)="onSubmit()">
                <div class="form-group mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" formControlName="username" name="user">
                </div>
                <div class="form-group mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" formControlName="password" name="pass">
                </div>
                <div class="form-group mb-3">
                    <button class="btn btn-dark" type="submit">Login</button>
                </div>
            </form>
        </div>
    </div>
</div>
