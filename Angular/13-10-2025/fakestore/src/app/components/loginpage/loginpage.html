<div class="container-fluid ">
    <br>
    <h1 align="center">Fake Store</h1>
    <hr>
    <div class="d-flex align-items-center justify-content-around">
        <div>
            <form class="card p-5" [formGroup]="loginform" (ngSubmit)="checkLogin()">
                <h3>Login Details</h3><br>
                <div class="form-group mb-3">
                    <label for="" class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" formControlName="username">
                </div>
                <div class="form-group mb-3">
                    <label for="" class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" formControlName="password">
                </div>
                <div class="form-group mb-3">
                    <button type="submit" class="btn btn-dark">Login</button>
                </div>
            </form>
        </div>
        <div>
            <img src="head.png" alt="" width="460px" height="490px">
        </div>
    </div>
</div>
