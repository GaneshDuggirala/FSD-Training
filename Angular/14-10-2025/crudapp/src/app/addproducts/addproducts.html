<div class="container-fluid">
    <br>
    <h1 align="center">Add Product</h1><hr><br>
    <div class="row">
        <div class="col-md-4">
            <form [formGroup]="addform" (ngSubmit)="addProduct()">
                <div class="form-group mb-3">
                    <label for="" class="form-label">Product Id</label>
                    <input type="text" class="form-control" name="pid" formControlName="productId">
                </div>
                <div class="form-group mb-3">
                    <label for="" class="form-label">Product Name</label>
                    <input type="text" class="form-control" name="pname" formControlName="productName">
                </div>
                <div class="form-group mb-3">
                    <label for="" class="form-label">Product Price</label>
                    <input type="text" class="form-control" name="pprice" formControlName="productPrice">
                </div>
                <div class="form-group mb-3">
                    <label for="" class="form-label">Product Description</label>
                    <input type="text" class="form-control" name="pdes" formControlName="productDescription">
                </div>
                <div class="form-group mb-3">
                    <label for="" class="form-label">Product Image</label>
                    <input type="text" class="form-control" name="pimg" formControlName="productImage">
                </div>
                <div class="form-group mb-3">
                    <button class="btn btn-success" type="submit">Add Product</button>
                </div>
            </form>
        </div>
    </div>
</div>
